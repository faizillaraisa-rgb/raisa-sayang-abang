
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080808;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}
</style>
</head>

<body>

<canvas id="love"></canvas>

<script>
const canvas = document.getElementById("love");
const ctx = canvas.getContext("2d");

let width, height;
let words = [];
let particles = [];

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    width = canvas.width;
    height = canvas.height;

    createWords();
}

window.addEventListener("resize", resize);

// Bentuk hati
function heart(t) {
    const x = 16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t) -
        5 * Math.cos(2 * t) -
        2 * Math.cos(3 * t) -
        Math.cos(4 * t);

    return { x, y };
}

// Membuat tulisan mengikuti pola hati
function createWords() {
    words = [];

    const scale = Math.min(width, height) / 36;
    const total = 180;

    for (let i = 0; i < total; i++) {
        const t = Math.random() * Math.PI * 2;
        const point = heart(t);

        const inside = Math.random();

        const x = width / 2 +
            point.x * scale * inside;

        const y = height / 2 -
            point.y * scale * inside;

        words.push({
            x: Math.random() * width,
            y: Math.random() * height,
            targetX: x,
            targetY: y,
            size: Math.random() * 7 + 7,
            speed: Math.random() * 0.025 + 0.008,
            phase: Math.random() * 6,
            text: Math.random() > 0.3
                ? "I LOVE YOU"
                : "love you",
            color: Math.random() > 0.5
                ? "#ff5733"
                : "#ff8566"
        });
    }

    // Tulisan tambahan di sekitar hati
    for (let i = 0; i < 100; i++) {
        words.push({
            x: Math.random() * width,
            y: Math.random() * height,
            targetX: Math.random() * width,
            targetY: Math.random() * height,
            size: Math.random() * 5 + 5,
            speed: Math.random() * 0.02 + 0.005,
            phase: Math.random() * 6,
            text: Math.random() > 0.5
                ? "I love you"
                : "love",
            color: "#ff6347"
        });
    }
}

// Animasi
function animate(time) {
    ctx.fillStyle = "rgba(8, 8, 8, 0.25)";
    ctx.fillRect(0, 0, width, height);

    words.forEach((word, i) => {

        const floatX = Math.sin(time * 0.001 + word.phase) * 15;
        const floatY = Math.cos(time * 0.001 + word.phase) * 12;

        word.x += (word.targetX - word.x) * word.speed;
        word.y += (word.targetY - word.y) * word.speed;

        ctx.save();

        ctx.translate(
            word.x + floatX,
            word.y + floatY
        );

        ctx.font = `bold ${word.size}px Arial`;

        ctx.fillStyle = word.color;

        ctx.globalAlpha =
            0.35 + Math.abs(Math.sin(time * 0.002 + i)) * 0.65;

        ctx.shadowColor = "#ff3300";
        ctx.shadowBlur = 8;

        ctx.fillText(word.text, 0, 0);

        ctx.restore();
    });

    requestAnimationFrame(animate);
}

resize();

requestAnimationFrame(animate);

// Klik layar untuk menambah efek hati
canvas.addEventListener("click", function(e) {

    for (let i = 0; i < 12; i++) {

        words.push({
            x: e.clientX,
            y: e.clientY,
            targetX: e.clientX + (Math.random() - 0.5) * 180,
            targetY: e.clientY + (Math.random() - 0.5) * 180,
            size: Math.random() * 10 + 8,
            speed: 0.04,
            phase: Math.random() * 6,
            text: "I LOVE YOU",
            color: "#ff5533"
        });
    }
});
</script>

</body>
</html>
