
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: Arial, sans-serif;
    text-align: center;
    color: white;
    overflow: hidden;
}

h1 {
    font-size: 35px;
}

.heart {
    font-size: 80px;
    animation: beat 1s infinite;
}

button {
    padding: 15px 25px;
    border: none;
    border-radius: 30px;
    background: #ff3366;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

#message {
    margin-top: 25px;
    font-size: 22px;
    max-width: 90%;
}

@keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.3); }
}
</style>
</head>

<body>

<div class="heart">❤️</div>

<h1>Hai, kamu!</h1>

<p>Ada sesuatu yang mau aku kasih tahu...</p>

<button onclick="showMessage()">
Klik di sini 💌
</button>

<div id="message"></div>

<script>
function showMessage() {
    document.getElementById("message").innerHTML =
    "Aku cuma mau bilang, kamu itu spesial banget buat aku ❤️";
}
</script>

</body>
</html>
