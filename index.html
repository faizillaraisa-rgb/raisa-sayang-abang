
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Abang aan❤️</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: white;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

#intro {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: radial-gradient(circle, #071329, #000 75%);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 22px;
  text-align: center;
  transition: opacity 1.5s;
}

#intro h1 {
  font-size: clamp(25px, 6vw, 45px);
  color: #9eeaff;
  text-shadow: 0 0 20px #008cff;
}

#intro p {
  color: #aaa;
}

button {
  padding: 14px 28px;
  border-radius: 40px;
  border: 1px solid #00aaff;
  background: #061a35;
  color: white;
  font-size: 15px;
  cursor: pointer;
  box-shadow: 0 0 20px #008cff55;
}

#musicButton {
  position: fixed;
  right: 15px;
  bottom: 18px;
  z-index: 8;
  font-size: 12px;
}

#title {
  position: fixed;
  top: 9%;
  width: 100%;
  text-align: center;
  color: #b9edff;
  font-size: clamp(20px, 5vw, 38px);
  letter-spacing: 4px;
  text-shadow: 0 0 15px #008cff;
  opacity: 0;
  transition: opacity 2s;
  pointer-events: none;
}

#subtitle {
  position: fixed;
  top: 17%;
  width: 100%;
  text-align: center;
  color: #66bfff;
  font-size: 12px;
  letter-spacing: 3px;
  opacity: 0;
  transition: opacity 2s;
  pointer-events: none;
}

#message {
  position: fixed;
  bottom: 12%;
  width: 100%;
  text-align: center;
  color: #b9eaff;
  font-size: clamp(14px, 3vw, 20px);
  text-shadow: 0 0 15px #008cff;
  opacity: 0;
  transition: opacity 3s;
  pointer-events: none;
}

.show {
  opacity: 1 !important;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="intro">
  <h1>FOR MY ABANG ❤️</h1>
  <p>A little universe made just for you...</p>
  <button onclick="startLove()">OPEN YOUR HEART ❤️</button>
</div>

<div id="title">I LOVE YOU ABANG</div>

<div id="subtitle">
  YOU ARE MY FAVORITE PERSON 💙
</div>

<div id="message">
  I LOVE YOU, ABANG ❤️
  <br><br>
  You make my world brighter ✨
</div>

<button id="musicButton" onclick="toggleMusic()">
  🎵 PLAY MUSIC
</button>

<audio id="music" loop preload="auto">
  <source src="Tulus_-_Jatuh_Suka_(mp3.pm).aac" type="audio/aac">
</audio>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const music = document.getElementById("music");

let W, H;
let time = 0;
let started = false;
let musicPlaying = false;

let hearts = [];
let blueParticles = [];
let stars = [];
let orbitParticles = [];

const TWO_PI = Math.PI * 2;

// =============================
// HEART SHAPE
// =============================

function heart(t) {
  return {
    x: 16 * Math.pow(Math.sin(t), 3),

    y:
      13 * Math.cos(t)
      - 5 * Math.cos(2 * t)
      - 2 * Math.cos(3 * t)
      - Math.cos(4 * t)
  };
}

// =============================
// RANDOM
// =============================

function random(min, max) {
  return Math.random() * (max - min) + min;
}

// =============================
// RESIZE
// =============================

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = W * dpr;
  canvas.height = H * dpr;

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  createScene();
}

window.addEventListener("resize", resize);

// =============================
// CREATE HEART
// =============================

function createHeart() {
  hearts = [];

  const scale = Math.min(W, H) * 0.021;

  for (let i = 0; i < 2600; i++) {
    const t = random(0, TWO_PI);

    const radius = Math.sqrt(Math.random());

    const p = heart(t);

    hearts.push({
      x: random(-W, W),
      y: random(-H, H),

      tx: p.x * scale * radius,
      ty: -p.y * scale * radius,

      tz: random(-1, 1),

      size: random(0.4, 1.7),

      speed: random(0.008, 0.035),

      phase: random(0, TWO_PI),

      color: Math.random() > 0.4
        ? "#ffffff"
        : "#a5e8ff"
    });
  }
}

// =============================
// BLUE PARTICLES
// =============================

function createBlueParticles() {
  blueParticles = [];

  for (let i = 0; i < 600; i++) {
    blueParticles.push({
      angle: random(0, TWO_PI),
      radius: random(0.3, 1.5),
      speed: random(0.001, 0.008),
      size: random(0.5, 2),
      phase: random(0, TWO_PI)
    });
  }
}

// =============================
// ORBIT
// =============================

function createOrbit() {
  orbitParticles = [];

  for (let i = 0; i < 150; i++) {
    orbitParticles.push({
      angle: random(0, TWO_PI),
      radius: random(0.8, 1.6),
      speed: random(0.001, 0.004),
      size: random(0.5, 1.5),
      color: Math.random() > 0.5
        ? "#00aaff"
        : "#75eaff"
    });
  }
}

// =============================
// STARS
// =============================

function createStars() {
  stars = [];

  for (let i = 0; i < 180; i++) {
    stars.push({
      x: random(0, W),
      y: random(0, H),
      size: random(0.3, 1.5),
      phase: random(0, TWO_PI)
    });
  }
}

// =============================
// CREATE SCENE
// =============================

function createScene() {
  createHeart();
  createBlueParticles();
  createOrbit();
  createStars();
}

// =============================
// 3D ROTATION
// =============================

function rotate3D(x, y, z, angleY, angleX) {
  const x1 = x * Math.cos(angleY) - z * Math.sin(angleY);

  const z1 = x * Math.sin(angleY) + z * Math.cos(angleY);

  const y2 = y * Math.cos(angleX) - z1 * Math.sin(angleX);

  const z2 = y * Math.sin(angleX) + z1 * Math.cos(angleX);

  return {
    x: x1,
    y: y2,
    z: z2
  };
}

// =============================
// PROJECTION
// =============================

function project(p, scale) {
  const perspective = 500;

  const depth = perspective / (perspective + p.z * 100);

  return {
    x: W / 2 + p.x * scale * depth,
    y: H * 0.46 + p.y * scale * depth,
    depth
  };
}

// =============================
// BACKGROUND
// =============================

function drawBackground() {
  const gradient = ctx.createRadialGradient(
    W / 2,
    H * 0.45,
    0,
    W / 2,
    H * 0.45,
    Math.max(W, H) * 0.8
  );

  gradient.addColorStop(0, "#07101d");
  gradient.addColorStop(0.5, "#020711");
  gradient.addColorStop(1, "#000000");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);
}

// =============================
// STARS
// =============================

function drawStars() {
  for (const s of stars) {
    ctx.globalAlpha =
      0.2 + Math.abs(Math.sin(time * 0.003 + s.phase)) * 0.8;

    ctx.fillStyle = "#bdeaff";

    ctx.fillRect(s.x, s.y, s.size, s.size);
  }

  ctx.globalAlpha = 1;
}

// =============================
// BLUE GLOW
// =============================

function drawGlow() {
  const pulse = 1 + Math.sin(time * 0.003) * 0.1;

  ctx.save();

  ctx.translate(W / 2, H * 0.75);
  ctx.scale(pulse, 1);

  const glow = ctx.createRadialGradient(
    0, 0, 0,
    0, 0, Math.min(W, H) * 0.35
  );

  glow.addColorStop(0, "rgba(0,180,255,0.7)");
  glow.addColorStop(0.2, "rgba(0,110,255,0.3)");
  glow.addColorStop(1, "rgba(0,0,0,0)");

  ctx.fillStyle = glow;
  ctx.fillRect(-W / 2, -H / 2, W, H);

  ctx.restore();
}

// =============================
// MOVING SPOTLIGHT
// =============================

function drawSpotlight() {
  const angle = time * 0.0007;

  const x = W / 2 + Math.sin(angle) * W * 0.35;

  const y = H * 0.12;

  ctx.save();

  ctx.globalCompositeOperation = "screen";

  const beam = ctx.createLinearGradient(
    x, y,
    W / 2, H
  );

  beam.addColorStop(0, "rgba(0,0,0,0)");
  beam.addColorStop(0.5, "rgba(50,150,255,0.04)");
  beam.addColorStop(1, "rgba(50,180,255,0.13)");

  ctx.fillStyle = beam;

  ctx.beginPath();

  ctx.moveTo(x - 20, y);
  ctx.lineTo(x + 20, y);
  ctx.lineTo(W / 2 + W * 0.3, H);
  ctx.lineTo(W / 2 - W * 0.3, H);

  ctx.closePath();
  ctx.fill();

  const light = ctx.createRadialGradient(
    x, y, 0,
    x, y, Math.min(W, H) * 0.3
  );

  light.addColorStop(0, "rgba(100,200,255,0.15)");
  light.addColorStop(1, "rgba(0,0,0,0)");

  ctx.fillStyle = light;
  ctx.fillRect(0, 0, W, H);

  ctx.restore();
}

// =============================
// DRAW HEART PARTICLES
// =============================

function drawHeart() {
  const scale = Math.min(W, H) * 0.021;

  const angleY = time * 0.0007;

  const angleX = Math.sin(time * 0.0004) * 0.25;

  const pulse = 1 + Math.sin(time * 0.003) * 0.04;

  const projected = [];

  for (const p of hearts) {
    const rotated = rotate3D(
      p.tx,
      p.ty,
      p.tz,
      angleY,
      angleX
    );

    const point = project(rotated, scale * pulse);

    projected.push({
      ...point,
      size: p.size,
      color: p.color,
      phase: p.phase
    });
  }

  projected.sort((a, b) => a.depth - b.depth);

  ctx.save();

  ctx.globalCompositeOperation = "screen";

  for (const p of projected) {
    ctx.globalAlpha =
      0.4 + Math.abs(Math.sin(time * 0.004 + p.phase)) * 0.6;

    ctx.fillStyle = p.color;

    ctx.shadowColor = "#6acbff";
    ctx.shadowBlur = 5;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.size * p.depth,
      0,
      TWO_PI
    );

    ctx.fill();
  }

  ctx.restore();
}

// =============================
// BLUE PARTICLES
// =============================

function drawBlueParticles() {
  ctx.save();

  ctx.globalCompositeOperation = "screen";

  for (const p of blueParticles) {
    p.angle += p.speed;

    const radius = p.radius * Math.min(W, H) * 0.25;

    const x = W / 2 + Math.cos(p.angle) * radius;

    const y = H * 0.46 +
      Math.sin(p.angle * 1.3 + p.phase) * radius * 0.6;

    ctx.globalAlpha =
      0.4 + Math.abs(Math.sin(p.angle)) * 0.6;

    ctx.fillStyle = "#00aaff";

    ctx.shadowColor = "#00aaff";
    ctx.shadowBlur = 15;

    ctx.beginPath();

    ctx.arc(x, y, p.size, 0, TWO_PI);

    ctx.fill();
  }

  ctx.restore();
}

// =============================
// ORBITING PARTICLES
// =============================

function drawOrbit() {
  ctx.save();

  ctx.globalCompositeOperation = "screen";

  for (const p of orbitParticles) {
    p.angle += p.speed;

    const radius = p.radius * Math.min(W, H) * 0.2;

    const x = W / 2 + Math.cos(p.angle) * radius;

    const y = H * 0.46 +
      Math.sin(p.angle) * radius * 0.5;

    ctx.globalAlpha =
      0.4 + Math.abs(Math.sin(p.angle)) * 0.6;

    ctx.fillStyle = p.color;

    ctx.shadowColor = "#00aaff";
    ctx.shadowBlur = 12;

    ctx.beginPath();

    ctx.arc(x, y, p.size, 0, TWO_PI);

    ctx.fill();
  }

  ctx.restore();
}

// =============================
// MAIN ANIMATION
// =============================

function animate() {
  time++;

  drawBackground();

  drawStars();

  if (started) {
    drawGlow();
    drawSpotlight();
    drawBlueParticles();
    drawOrbit();
    drawHeart();
  }

  requestAnimationFrame(animate);
}

// =============================
// START
// =============================

async function startLove() {
  started = true;

  const intro = document.getElementById("intro");

  intro.style.opacity = "0";

  setTimeout(() => {
    intro.style.display = "none";
  }, 1500);

  document.getElementById("title").classList.add("show");

  document.getElementById("subtitle").classList.add("show");

  setTimeout(() => {
    document.getElementById("message").classList.add("show");
  }, 4000);

  try {
    await music.play();

    musicPlaying = true;

    document.getElementById("musicButton").textContent =
      "⏸ PAUSE MUSIC";

  } catch (error) {
    document.getElementById("musicButton").textContent =
      "🎵 PLAY MUSIC";
  }
}

// =============================
// MUSIC
// =============================

async function toggleMusic() {
  if (musicPlaying) {
    music.pause();

    musicPlaying = false;

    document.getElementById("musicButton").textContent =
      "🎵 PLAY MUSIC";

  } else {
    try {
      await music.play();

      musicPlaying = true;

      document.getElementById("musicButton").textContent =
        "⏸ PAUSE MUSIC";

    } catch (error) {
      alert("Musik belum bisa diputar. Periksa file audio.");
    }
  }
}

// =============================
// INITIALIZE
// =============================

resize();

animate();

</script>

</body>
</html>
